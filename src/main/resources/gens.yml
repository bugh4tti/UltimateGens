# ============================================
#  UltimateGens - gens.yml
#  Solo el "starter-generator" (config.yml) se compra.
#  El resto se obtiene mejorando con agachado + click derecho
#  (siguiendo el campo "next").
#  Sin "next" = nivel máximo.
# ============================================
